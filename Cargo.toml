[package]
name = "scorpiofs"
version = "0.4.1"
edition = "2021"
# `cargo run` (no --bin) runs the `scorpio` workspace binary.
default-run = "scorpio"
description = "FUSE-based fixed monorepo snapshots and private workspaces"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gitmono-dev/scorpiofs"
documentation = "https://docs.rs/scorpiofs"
keywords = ["fuse", "filesystem", "overlay", "monorepo", "build-system"]
categories = ["filesystem", "development-tools::build-utils"]
readme = "README.md"


[lib]
name = "scorpiofs"
path = "src/lib.rs"

# The distribution has one binary, `scorpio`; the crate/lib is `scorpiofs`.
[[bin]]
name = "scorpio"
path = "src/main.rs"


[dependencies]
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
axum = { version = "0.8.9", features = ["macros"] }
asyncfuse = { version = "0.1.14", features = [
    "tokio-runtime",
    "unprivileged",
    "file-lock",
] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"

toml = "1.1.6"
libc = "0.2.190"
tracing = "0.1.44"
serde_json = "1.0.151"
bytes = "1.12.1"
futures = "0.3.34"
uuid = { version = "1.27.0", features = ["v4"] }
# Keep the published 0.3 API while adopting reviewed private-staging copy-up
# and its explicit recovery Result until the corresponding release is available.
libfuse-fs = { git = "https://github.com/rk8s-dev/rk8s", rev = "01dee0288279ee9cd885c2a0714fed421e735cff", version = "=0.3.0" }
whoami = "2.1.3"
thiserror = "2.0.21"
ring = "0.17.14"
hex = "0.4.3"
url = "2.5.8"
time = { version = "0.3.55", features = ["parsing"] }

async-trait = "0.1.92"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Shared MST/2 byte codec (specs 03/05/06/07). Pure
# codec only — no HTTP/DB/FUSE types leak through it. `zstd` enables the
# optional strict single-frame frame encoding (spec 06 §3). Pin the reviewed
# raw-payload digest fix until the corresponding registry release is available.
mst2-codec = { git = "https://github.com/gitmono-dev/mst2-codec", rev = "dc5ec7650a221ec07a62f4dea4be9ddf17ad924e", version = "=0.4.0", features = ["zstd"] }


# libfuse-fs pulls reqwest 0.12 → native-tls → openssl-sys. Vendored OpenSSL
# lets aarch64-unknown-linux-musl cross builds succeed without a sysroot .pc.
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10.81", features = ["vendored"] }

[features]
async-io = []
qlean-ci = []

[dev-dependencies]
anyhow = "1.0.104"
tempfile = "3.27.0"
assert_cmd = "2.2.2"
reqwest = "0.13.5"
http = "1.5.0"
tower = "0.5.3"

[[test]]
name = "qlean_installer"
path = "tests/qlean_installer.rs"
required-features = ["qlean-ci"]

[target.'cfg(target_os = "linux")'.dev-dependencies]
qlean = "0.3.2"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
