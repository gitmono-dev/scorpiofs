[package]
name = "scorpiofs"
version = "0.4.0"
edition = "2021"
# `cargo run` (no --bin) runs the main `scorpio` binary; `antares` is the alias.
default-run = "scorpio"
description = "FUSE-based virtual filesystem with Antares overlay for monorepo builds"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gitmono-dev/scorpiofs"
documentation = "https://docs.rs/scorpiofs"
keywords = ["fuse", "filesystem", "overlay", "monorepo", "build-system"]
categories = ["filesystem", "development-tools::build-utils"]
readme = "README.md"


[lib]
name = "scorpiofs"
path = "src/lib.rs"

# The main binary is `scorpio` (the crate/lib is `scorpiofs`). `antares` is
# auto-discovered from src/bin/antares.rs and kept as a deprecated alias.
[[bin]]
name = "scorpio"
path = "src/main.rs"


[dependencies]
git-internal = "0.8.7"
reqwest = { version = "0.13.4", features = ["json", "blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["macros"] }
asyncfuse = { version = "0.1.12", features = [
    "tokio-runtime",
    "unprivileged",
    "file-lock",
] }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6"

toml = "1.1.4"
libc = "0.2.189"
log = "0.4.34"
radix_trie = "0.3.0"
tracing = "0.1.44"
serde_json = "1.0.151"
once_cell = "1.21.4"
env_logger = "0.11.11"
sled = "0.34.7"
# bincode 3.0.0 on crates.io is a broken placeholder (compile_error!), stay on 2.x
bincode = "2.0.1"
async-recursion = "1.1.1"
bytes = "1.12.1"
futures = "0.3.34"
uuid = { version = "1.26.0", features = ["v4"] }
libfuse-fs = "0.2.0"
whoami = "2.1.3"
thiserror = "2.0.20"
crossbeam = "0.8.4"
dashmap = "6.2.1"
ring = "0.17.14"
hex = "0.4.3"
url = "2.5"

async-trait = "0.1.92"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }


[features]
async-io = []
qlean-ci = []

[dev-dependencies]
anyhow = "1.0.104"
tempfile = "3.27.0"
serial_test = "4.0.1"
lazy_static = "1.5.0"
assert_cmd = "2.2.2"
scopeguard = "1.2.0"
testcontainers = { version = "0.28.0", features = [
    "http_wait",
    "reusable-containers",
] }
reqwest = { version = "0.13.4", features = ["blocking"] }
http = "1.5.0"
tower = "0.5.3"

[[test]]
name = "qlean_installer"
path = "tests/qlean_installer.rs"
required-features = ["qlean-ci"]

[target.'cfg(target_os = "linux")'.dev-dependencies]
qlean = "0.3.1"

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
