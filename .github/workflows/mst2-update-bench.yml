name: MST2 client update benchmark

on:
  pull_request:
    paths:
      - src/snapshot/**
      - tests/mst2_commit_update_bench.rs
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/mst2-update-bench.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mst2-update-bench-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  medium:
    name: Medium client update scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
      MST2_UPDATE_BENCH_DIRS: "32"
      MST2_UPDATE_BENCH_FILES: "128"
      MST2_UPDATE_BENCH_ROUNDS: "5"
      MST2_UPDATE_BENCH_BYTES: "256"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run six loopback client scenarios with five rounds each
        run: cargo test --locked --test mst2_commit_update_bench -- --nocapture
