name: Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    # Match the oldest supported GNU release baseline so PR builds catch
    # accidental dependencies on newer glibc versions before a tag is cut.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v7

      
      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-ubuntu-22.04-${{ matrix.rust }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build debug
        run: cargo build --verbose
      
      - name: Build release
        run: cargo build --release --verbose

      - name: Test installer validation
        if: matrix.rust == 'stable'
        run: bash script/test_installer.sh

      - name: Exercise installer with local release
        if: matrix.rust == 'stable'
        run: |
          set -euo pipefail
          version="v0.0.0-local"
          target="x86_64-unknown-linux-gnu"
          asset_root="${RUNNER_TEMP}/scorpiofs-installer-assets"
          dist="scorpiofs-${version}-${target}"
          install_root="${RUNNER_TEMP}/scorpiofs-installed"

          mkdir -p "${asset_root}/${version}/${dist}"
          cp target/release/scorpio "${asset_root}/${version}/${dist}/"
          tar -C "${asset_root}/${version}" -czf "${asset_root}/${version}/${dist}.tar.gz" "${dist}"
          (
            cd "${asset_root}/${version}"
            sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256"
          )

          python3 -m http.server 18080 --bind 127.0.0.1 --directory "${asset_root}" \
            >"${RUNNER_TEMP}/scorpiofs-installer-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl -fsS "http://127.0.0.1:18080/${version}/${dist}.tar.gz.sha256" >/dev/null; then
              break
            fi
            sleep 0.25
          done

          installer_common=(
            --version "${version}"
            --release-base-url http://127.0.0.1:18080
            --non-interactive
            --no-deps
            --no-service
            --prefix "${install_root}/prefix"
            --config-dir "${install_root}/etc"
            --http-addr 127.0.0.1:2825
          )
          config="${install_root}/etc/scorpio.toml"
          store="${install_root}/data/store"
          sudo bash install.sh "${installer_common[@]}" \
            --enable-user-allow-other \
            --mst2-base-url https://mega.example.com \
            --data-root "${install_root}/data" \
            --store-path "${store}"

          "${install_root}/prefix/bin/scorpio" --version
          test ! -e "${install_root}/prefix/bin/antares"
          "${install_root}/prefix/bin/scorpio" --config-path "${config}" config validate
          grep -Fx 'mst2_base_url = "https://mega.example.com"' "${config}"
          grep -Fx "store_path = \"${store}\"" "${config}"
          grep -Fx 'log_level = "info"' "${config}"
          test "$(grep -c '^[a-z_]* = ' "${config}")" -eq 3
          "${install_root}/prefix/bin/scorpio" --config-path "${config}" config installer-paths \
            >"${RUNNER_TEMP}/v3-installer-paths"
          python3 - "${RUNNER_TEMP}/v3-installer-paths" "${store}" <<'PY'
          import pathlib, sys
          actual = pathlib.Path(sys.argv[1]).read_bytes()
          store = sys.argv[2].encode()
          expected = b"\0".join((store, store + b"/workspaces-v3", store + b"/mst2-cache")) + b"\0"
          assert actual == expected, actual
          PY

          # Retained legacy keys are inert; preserve their bytes and historical files.
          printf '%s\n' \
            'base_url = "https://legacy.example.com"' \
            'lfs_url = "https://legacy.example.com/lfs"' \
            'workspace = "retired-mount"' \
            'config_file = "custom-state/scorpio.toml"' \
            'antares_state_file = "custom-state/antares.toml"' | sudo tee -a "${config}" >/dev/null
          custom_config="${install_root}/data/custom-state/scorpio.toml"
          custom_antares_state="${install_root}/data/custom-state/antares.toml"
          sudo install -d "${install_root}/data/custom-state" "${install_root}/data/antares"
          for historical in "${install_root}/data/config.toml" \
            "${install_root}/data/antares/state.toml" "${custom_config}" "${custom_antares_state}"; do
            sudo install -m 0644 -o nobody -g nogroup /dev/null "${historical}"
          done
          sudo install -d -o nobody -g nogroup "${store}/content.db"
          sudo install -m 0644 -o nobody -g nogroup /dev/null "${store}/content.db/LOCK"
          sudo install -m 0644 -o nobody -g nogroup /dev/null "${store}/mst2-cache/cas-object"
          sudo chown nobody:nogroup "${config}"
          retained_sha="$(sudo sha256sum "${config}" | cut -d ' ' -f1)"

          sudo bash install.sh "${installer_common[@]}" \
            --dry-run --no-user-allow-other \
            --mst2-base-url https://ignored.example.com \
            >"${RUNNER_TEMP}/retained-dry-run.log"
          grep -F "using data-root inferred from retained config: ${install_root}/data" \
            "${RUNNER_TEMP}/retained-dry-run.log"
          grep -F "using runtime paths from retained ${config}" "${RUNNER_TEMP}/retained-dry-run.log"
          grep -F "[dry-run] chown -R -h -P ${USER}:${USER} -- ${store}" \
            "${RUNNER_TEMP}/retained-dry-run.log"
          test "$(sudo sha256sum "${config}" | cut -d ' ' -f1)" = "${retained_sha}"
          test "$(stat -c '%U' "${store}/content.db/LOCK")" = nobody

          unrelated_root="${install_root}/unrelated-data"
          sudo install -d -o root -g root "${unrelated_root}"
          sudo touch "${unrelated_root}/unrelated-file"
          if sudo bash install.sh "${installer_common[@]}" \
            --no-user-allow-other --mst2-base-url https://ignored.example.com \
            --data-root "${unrelated_root}" --store-path "${unrelated_root}/store" \
            >"${RUNNER_TEMP}/unrelated-root.log" 2>&1; then
            echo "installer accepted an unrelated nonempty data root" >&2
            exit 1
          fi
          grep -F 'must be inside data-root' "${RUNNER_TEMP}/unrelated-root.log"
          test "$(stat -c '%U' "${unrelated_root}")" = root
          test "$(stat -c '%U' "${unrelated_root}/unrelated-file")" = root

          sudo bash install.sh "${installer_common[@]}" \
            --no-user-allow-other --mst2-base-url https://ignored.example.com
          test "$(sha256sum "${config}" | cut -d ' ' -f1)" = "${retained_sha}"
          test "$(stat -c '%U' "${config}")" = "${USER}"
          test "$(stat -c '%U' "${store}/content.db/LOCK")" = "${USER}"
          test "$(stat -c '%U' "${store}/mst2-cache/cas-object")" = "${USER}"
          for historical in "${install_root}/data/config.toml" \
            "${install_root}/data/antares/state.toml" "${custom_config}" "${custom_antares_state}"; do
            test "$(stat -c '%U' "${historical}")" = nobody
          done
          grep -Fx 'mst2_base_url = "https://mega.example.com"' "${config}"

          sudo sed -i 's/^log_level = "info"$/log_level = false/' "${config}"
          invalid_sha="$(sha256sum "${config}" | cut -d ' ' -f1)"
          if sudo env SCORPIO_LOG_LEVEL=info bash install.sh "${installer_common[@]}" \
            --no-user-allow-other --mst2-base-url https://ignored.example.com \
            >"${RUNNER_TEMP}/config-env-override.log" 2>&1; then
            echo "installer accepted an invalid retained config through an environment override" >&2
            exit 1
          fi
          grep -F 'could not safely resolve runtime paths from retained config' \
            "${RUNNER_TEMP}/config-env-override.log"
          test "$(sha256sum "${config}" | cut -d ' ' -f1)" = "${invalid_sha}"
          sudo sed -i 's/^log_level = false$/log_level = "info"/' "${config}"

          sudo bash install.sh "${installer_common[@]}" \
            --overwrite-config --no-user-allow-other \
            --mst2-base-url https://new-mega.example.com \
            --data-root "${install_root}/data" --store-path "${store}"
          grep -Fx 'mst2_base_url = "https://new-mega.example.com"' "${config}"
          test "$(grep -c '^[a-z_]* = ' "${config}")" -eq 3

          sudo bash script/test_installer_systemd.sh \
            "${version}" \
            http://127.0.0.1:18080 \
            "/tmp/scorpiofs-systemd-test-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
