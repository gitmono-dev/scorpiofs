name: MST2 request-bound projection update benchmark

on:
  workflow_dispatch:
    inputs:
      mega_sha:
        description: Immutable reviewed server SHA with typed projection writer
        required: true
      profile:
        type: choice
        description: Fixture size
        options: [medium, smoke]
        default: medium
      rounds:
        description: Complete repetitions (3 to 10)
        required: true
        default: '3'
      session_started_utc:
        description: Actual dispatch UTC T0, retained on recovery
        required: true
      session_deadline_utc:
        description: Original absolute UTC D, exactly T0 plus 235 minutes
        required: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 220
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      NO_PROXY: localhost,127.0.0.1
      MEGA_SHA: ${{ inputs.mega_sha }}
      SCORPIO_SHA: ${{ github.sha }}
      PROFILE: ${{ inputs.profile }}
      ROUNDS: ${{ inputs.rounds }}
      STARTED_INPUT: ${{ inputs.session_started_utc }}
      DEADLINE_INPUT: ${{ inputs.session_deadline_utc }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SCORPIO_SHA }}
          path: scorpiofs
          persist-credentials: false

      - name: Admit original dispatch window before builds
        shell: bash
        run: |
          python3 -B - <<'PY'
          import os, sys
          sys.path.insert(0, 'scorpiofs/tests/mst2-e2e')
          from commit_update_projection import window_anchor
          anchor = window_anchor(os.environ['STARTED_INPUT'], os.environ['DEADLINE_INPUT'], admission=True)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('MST2_SESSION_STARTED=' + os.environ['STARTED_INPUT'] + '\n')
              stream.write('MST2_SESSION_DEADLINE=' + os.environ['DEADLINE_INPUT'] + '\n')
              stream.write('MST2_WORK_CLEANUP_DEADLINE_MONOTONIC=' + repr(anchor) + '\n')
              stream.write('MST2_OWNED_ROOT=' + os.environ['RUNNER_TEMP'] + '/mst2-real-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '\n')
          PY

      - uses: actions/checkout@v7
        with:
          repository: gitmono-dev/mega2
          ref: ${{ env.MEGA_SHA }}
          path: mega2
          persist-credentials: false

      - uses: actions/cache@v6
        with:
          path: scorpiofs/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('scorpiofs/Cargo.lock') }}

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfuse3-dev protobuf-compiler postgresql-client

      - uses: dtolnay/rust-toolchain@stable

      - name: Build immutable server and measurement client
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MEGA_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C scorpiofs rev-parse HEAD)" = "$SCORPIO_SHA"
          test "$(git -C mega2 rev-parse HEAD)" = "$MEGA_SHA"
          for target in server client; do
            if test "$target" = server; then
              python3 -B scorpiofs/tests/mst2-e2e/commit_update_budget.py --rounds "$ROUNDS" --stage server-build -- \
                cargo build --manifest-path mega2/Cargo.toml --locked --release --bin mega2
            else
              python3 -B scorpiofs/tests/mst2-e2e/commit_update_budget.py --rounds "$ROUNDS" --stage client-build -- \
                cargo build --manifest-path scorpiofs/Cargo.toml --locked --release --example mst2_update_measure
            fi
          done

      - name: Check collector and actual process ownership
        shell: bash
        run: |
          python3 -B scorpiofs/tests/mst2-e2e/commit_update_budget.py --rounds "$ROUNDS" --stage fences -- bash -euo pipefail -c '
            python3 -B scorpiofs/tests/mst2-e2e/test_commit_update_bench.py -v
            python3 -B scorpiofs/tests/mst2-e2e/test_commit_update_budget.py -v
            python3 -B scorpiofs/tests/mst2-e2e/test_commit_update_projection.py -v
            MST2_MEASURE_DRIVER="$GITHUB_WORKSPACE/scorpiofs/target/release/examples/mst2_update_measure" \
              cargo test --manifest-path scorpiofs/Cargo.toml --locked --release --example mst2_update_measure
          '

      - name: Measure actual request-bound commit updates on owned deployment
        shell: bash
        run: |
          set -euo pipefail
          DRIVER="$GITHUB_WORKSPACE/scorpiofs/target/release/examples/mst2_update_measure"
          DRIVER_SHA=$(sha256sum "$DRIVER" | cut -d ' ' -f 1)
          python3 -B scorpiofs/tests/mst2-e2e/commit_update_ci.py --execute --projection-traces \
            --run-root "$MST2_OWNED_ROOT" --mega-source "$GITHUB_WORKSPACE/mega2" \
            --mega-sha "$MEGA_SHA" --mega-binary "$GITHUB_WORKSPACE/mega2/target/release/mega2" \
            --driver "$DRIVER" --driver-sha256 "$DRIVER_SHA" --profile "$PROFILE" --rounds "$ROUNDS" \
            --session-started-utc "$MST2_SESSION_STARTED" --session-deadline-utc "$MST2_SESSION_DEADLINE"

      - name: Clean up owned deployment within original H
        if: always()
        shell: bash
        run: |
          if test -n "$MST2_OWNED_ROOT" && test -f scorpiofs/tests/mst2-e2e/commit_update_ci.py; then
            python3 -B scorpiofs/tests/mst2-e2e/commit_update_ci.py --cleanup --run-root "$MST2_OWNED_ROOT" \
              --session-deadline-utc "$MST2_SESSION_DEADLINE" --rounds "$ROUNDS"
          fi
