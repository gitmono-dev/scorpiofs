name: MST2 shipped workspace v3 commit updates
run-name: MST2 v3 ${{ inputs.runner_label }} ${{ inputs.session_started_utc }}

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Existing Linux Actions runner label; large requires sufficient free disk (about 109 GiB)
        required: true
        default: ubuntu-latest
      mega_sha:
        description: Immutable reviewed native server SHA
        required: true
      comparison:
        type: choice
        description: Isolated fair A/B plus independent B diagnostic, or historical harness modes
        options: [isolated, single, paired]
        default: isolated
      baseline_sha:
        description: Immutable baseline client SHA for paired comparison
        default: 'd265e31169fb2f8b137ce9922784ebd0238c6397'
      candidate_sha:
        description: Immutable candidate client SHA, separate from workflow harness H
        default: 'f18b99645d7bbbc5b4ea3374165e57dc4ff9f922'
      bootstrap_commit_time:
        description: Common uint32 bootstrap seconds; isolated mode requires reproducible server init
        default: '1700000000'
      profile:
        type: choice
        description: Bounded /project fixture; history-large measures ten bulk commits; large and history-large require isolated backends
        options: [smoke, medium, large, history-large]
        default: smoke
      rounds:
        description: Complete cold/single/rename/batch repetitions (3 to 10)
        required: true
        default: '3'
      session_started_utc:
        description: Actual dispatch UTC start, retained on recovery
        required: true
      session_deadline_utc:
        description: Original UTC deadline, exactly start plus 235 minutes
        required: true
      recover_original_window:
        type: boolean
        description: Retry a failed measurement using its original start and deadline
        default: false
      workspace_read_profile:
        type: boolean
        description: Opt into read diagnostics; timings cannot establish uninstrumented A/B or Git performance
        default: false

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ${{ inputs.runner_label || 'ubuntu-latest' }}
    timeout-minutes: 235
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      NO_PROXY: localhost,127.0.0.1
      MEGA_SHA: ${{ inputs.mega_sha }}
      SCORPIO_SHA: ${{ github.sha }}
      COMPARISON: ${{ inputs.comparison }}
      BASELINE_SHA: ${{ inputs.baseline_sha }}
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
      PROFILE: ${{ inputs.profile }}
      ROUNDS: ${{ inputs.rounds }}
      STARTED_INPUT: ${{ inputs.session_started_utc }}
      DEADLINE_INPUT: ${{ inputs.session_deadline_utc }}
      RECOVERY_INPUT: ${{ inputs.recover_original_window }}
      READ_PROFILE_INPUT: ${{ inputs.workspace_read_profile }}
      BOOTSTRAP_COMMIT_TIME: ${{ inputs.bootstrap_commit_time }}
      RUNNER_LABEL: ${{ inputs.runner_label || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SCORPIO_SHA }}
          path: scorpiofs
          persist-credentials: false

      - name: Admit the original session window before builds
        shell: bash
        run: |
          python3 -B - <<'PY'
          import os, sys
          sys.path.insert(0, 'scorpiofs/tests/mst2-e2e')
          from commit_update_projection import window_anchor
          from workspace_update_size import admit_backend, admit_campaign_disk, runner_label
          import re
          runner_label(os.environ.get('RUNNER_LABEL', 'ubuntu-latest'))
          comparison = os.environ.get('COMPARISON', 'single')
          if comparison not in ('single', 'paired', 'isolated'):
              raise ValueError('invalid comparison mode')
          admit_backend(os.environ['PROFILE'], comparison == 'isolated')
          if os.environ['PROFILE'] in ('large', 'history-large'):
              from pathlib import Path
              import json
              owned_root = Path(os.environ['RUNNER_TEMP']) / ('mst2-real-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
              print(json.dumps({'campaign_disk_admission': admit_campaign_disk(os.environ['PROFILE'], owned_root)}))
          if comparison in ('paired', 'isolated'):
              if os.environ['ROUNDS'] != '3' or any(not re.fullmatch(r'[0-9a-f]{40}', os.environ[k]) for k in ('BASELINE_SHA', 'CANDIDATE_SHA')):
                  raise ValueError('paired measurement requires two immutable SHAs and three rounds')
              if os.environ['BASELINE_SHA'] == os.environ['CANDIDATE_SHA']:
                  raise ValueError('paired comparison requires distinct client versions')
          recovery = os.environ.get('RECOVERY_INPUT', 'false')
          if recovery not in ('false', 'true'):
              raise ValueError('invalid original-window recovery flag')
          if comparison == 'isolated':
              from workspace_update_campaign import commit_time
              from workspace_update_build import comparison_pair
              comparison_pair(os.environ['BASELINE_SHA'], os.environ['CANDIDATE_SHA'])
              if recovery != 'false' or os.environ.get('READ_PROFILE_INPUT', 'false') != 'false':
                  raise ValueError('isolated campaign requires immutable sources, no recovery and separate diagnostic')
              commit_time(os.environ['BOOTSTRAP_COMMIT_TIME'])
          anchor = window_anchor(os.environ['STARTED_INPUT'], os.environ['DEADLINE_INPUT'], admission=recovery == 'false')
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('MST2_SESSION_STARTED=' + os.environ['STARTED_INPUT'] + '\n')
              stream.write('MST2_SESSION_DEADLINE=' + os.environ['DEADLINE_INPUT'] + '\n')
              stream.write('MST2_WORK_CLEANUP_DEADLINE_MONOTONIC=' + repr(anchor) + '\n')
              stream.write('MST2_OWNED_ROOT=' + os.environ['RUNNER_TEMP'] + '/mst2-real-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '\n')
              for label in ('a', 'b'):
                  stream.write('MST2_BUILD_' + label.upper() + '=' + os.environ['RUNNER_TEMP'] + '/mst2-client-' + label + '-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.json\n')
              stream.write('MST2_SERVER_BUILD=' + os.environ['RUNNER_TEMP'] + '/mst2-server-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'] + '.json\n')
          PY

      - uses: actions/checkout@v7
        with:
          repository: gitmono-dev/mega2
          ref: ${{ env.MEGA_SHA }}
          path: mega2
          persist-credentials: false

      - uses: actions/cache@v6
        with:
          path: scorpiofs/target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('scorpiofs/Cargo.lock') }}

      - uses: actions/checkout@v7
        if: inputs.comparison != 'single'
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: client-a
          persist-credentials: false

      - uses: actions/checkout@v7
        if: inputs.comparison != 'single'
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: client-b
          persist-credentials: false

      - uses: actions/cache@v6
        if: inputs.comparison != 'single'
        with:
          path: client-a/target
          key: ${{ runner.os }}-mst2-client-a-release-${{ hashFiles('client-a/Cargo.lock') }}

      - uses: actions/cache@v6
        if: inputs.comparison != 'single'
        with:
          path: client-b/target
          key: ${{ runner.os }}-mst2-client-b-release-${{ hashFiles('client-b/Cargo.lock') }}

      - name: Install native FUSE and owned server dependencies
        if: inputs.comparison != 'isolated'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libfuse3-dev fuse3 protobuf-compiler postgresql-client
          if ! grep -qxF user_allow_other /etc/fuse.conf; then
            printf '\nuser_allow_other\n' | sudo tee -a /etc/fuse.conf >/dev/null
          fi
          grep -qxF user_allow_other /etc/fuse.conf
          test -c /dev/fuse
          test -r /dev/fuse
          test -w /dev/fuse
          fusermount3 --version

      - uses: dtolnay/rust-toolchain@stable
        if: inputs.comparison != 'isolated'

      - name: Install isolated native dependencies and toolchain under original preflight deadline
        if: inputs.comparison == 'isolated'
        shell: bash
        run: |
          python3 -B scorpiofs/tests/mst2-e2e/commit_update_budget.py --paired --isolated-backends \
            --rounds 3 --stage preflight -- bash -euo pipefail -c '
              sudo apt-get update
              sudo apt-get install -y pkg-config libssl-dev libfuse3-dev fuse3 protobuf-compiler postgresql-client
              if ! grep -qxF user_allow_other /etc/fuse.conf; then
                printf "\nuser_allow_other\n" | sudo tee -a /etc/fuse.conf >/dev/null
              fi
              grep -qxF user_allow_other /etc/fuse.conf
              test -c /dev/fuse && test -r /dev/fuse && test -w /dev/fuse
              fusermount3 --version
              rustup toolchain install stable --profile minimal
              rustup default stable
            '

      - name: Verify checkout and native preflight used the original 15-minute slot
        if: inputs.comparison == 'isolated'
        shell: bash
        run: |
          python3 -B scorpiofs/tests/mst2-e2e/commit_update_budget.py --paired --isolated-backends \
            --rounds 3 --stage preflight -- python3 -B -c 'import os; assert os.path.isfile("mega2/Cargo.lock")'

      - name: Build immutable server and shipped v3 client
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MEGA_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C scorpiofs rev-parse HEAD)" = "$SCORPIO_SHA"
          test "$(git -C mega2 rev-parse HEAD)" = "$MEGA_SHA"
          budget_mode=()
          if test "$COMPARISON" = paired; then budget_mode=(--paired); fi
          if test "$COMPARISON" = isolated; then budget_mode=(--paired --isolated-backends); fi
          if test "$COMPARISON" = isolated; then
            python3 -B scorpiofs/tests/mst2-e2e/commit_update_budget.py "${budget_mode[@]}" --rounds "$ROUNDS" --stage server-build -- \
              python3 -B scorpiofs/tests/mst2-e2e/workspace_update_build.py --label server \
                --source "$GITHUB_WORKSPACE/mega2" --source-sha "$MEGA_SHA" --receipt "$MST2_SERVER_BUILD"
          else
            python3 -B scorpiofs/tests/mst2-e2e/commit_update_budget.py "${budget_mode[@]}" --rounds "$ROUNDS" --stage server-build -- \
              cargo build --manifest-path mega2/Cargo.toml --locked --release --bin mega2
          fi
          if test "$COMPARISON" != single; then
            python3 -B scorpiofs/tests/mst2-e2e/commit_update_budget.py "${budget_mode[@]}" --rounds "$ROUNDS" --stage client-a-build -- \
              python3 -B scorpiofs/tests/mst2-e2e/workspace_update_build.py --label a \
                --source "$GITHUB_WORKSPACE/client-a" --source-sha "$BASELINE_SHA" --receipt "$MST2_BUILD_A"
            python3 -B scorpiofs/tests/mst2-e2e/commit_update_budget.py "${budget_mode[@]}" --rounds "$ROUNDS" --stage client-b-build -- \
              python3 -B scorpiofs/tests/mst2-e2e/workspace_update_build.py --label b \
                --source "$GITHUB_WORKSPACE/client-b" --source-sha "$CANDIDATE_SHA" --receipt "$MST2_BUILD_B"
          else
            python3 -B scorpiofs/tests/mst2-e2e/commit_update_budget.py --rounds "$ROUNDS" --stage client-build -- \
              cargo build --manifest-path scorpiofs/Cargo.toml --locked --release --bin scorpio
          fi

      - name: Check evidence and owned process deadlines
        shell: bash
        run: |
          budget_mode=()
          if test "$COMPARISON" = paired; then budget_mode=(--paired); fi
          if test "$COMPARISON" = isolated; then budget_mode=(--paired --isolated-backends); fi
          python3 -B scorpiofs/tests/mst2-e2e/commit_update_budget.py "${budget_mode[@]}" --rounds "$ROUNDS" --stage fences -- bash -euo pipefail -c '
            python3 -B scorpiofs/tests/mst2-e2e/test_commit_update_bench.py -v
            python3 -B scorpiofs/tests/mst2-e2e/test_commit_update_budget.py -v
            python3 -B scorpiofs/tests/mst2-e2e/test_commit_update_projection.py -v
            python3 -B -m unittest discover -s scorpiofs/tests/mst2-e2e -p "test_workspace_update_*.py" -v
          '

      - name: Measure real publication to retained v3 workspaces and Git
        shell: bash
        run: |
          set -euo pipefail
          client_args=()
          diagnostic_args=()
          if test "${READ_PROFILE_INPUT:-false}" = true; then
            diagnostic_args=(--workspace-read-profile)
          elif test "${READ_PROFILE_INPUT:-false}" != false; then
            exit 1
          fi
          if test "$COMPARISON" != single; then
            client_args=(--paired --build-a "$MST2_BUILD_A" --build-b "$MST2_BUILD_B" --baseline-sha "$BASELINE_SHA" --candidate-sha "$CANDIDATE_SHA")
          else
            DRIVER="$GITHUB_WORKSPACE/scorpiofs/target/release/scorpio"
            DRIVER_SHA=$(sha256sum "$DRIVER" | cut -d ' ' -f 1)
            client_args=(--driver "$DRIVER" --driver-sha256 "$DRIVER_SHA")
          fi
          if test "$COMPARISON" = isolated; then
            client_args+=(--isolated-backends --harness-sha "$SCORPIO_SHA" --bootstrap-commit-time "$BOOTSTRAP_COMMIT_TIME" --server-build-receipt "$MST2_SERVER_BUILD")
          fi
          python3 -B scorpiofs/tests/mst2-e2e/commit_update_ci.py --execute --projection-traces \
            --run-root "$MST2_OWNED_ROOT" --mega-source "$GITHUB_WORKSPACE/mega2" \
            --mega-sha "$MEGA_SHA" --mega-binary "$GITHUB_WORKSPACE/mega2/target/release/mega2" \
            "${client_args[@]}" "${diagnostic_args[@]}" --profile "$PROFILE" --rounds "$ROUNDS" \
            --session-started-utc "$MST2_SESSION_STARTED" --session-deadline-utc "$MST2_SESSION_DEADLINE"

      - name: Verify cleanup within the original deadline
        if: always()
        shell: bash
        run: |
          if test -n "$MST2_OWNED_ROOT" && test -f scorpiofs/tests/mst2-e2e/commit_update_ci.py; then
            budget_mode=()
            if test "$COMPARISON" = paired; then budget_mode=(--paired); fi
            if test "$COMPARISON" = isolated; then budget_mode=(--paired --isolated-backends); fi
            python3 -B scorpiofs/tests/mst2-e2e/commit_update_ci.py --cleanup --run-root "$MST2_OWNED_ROOT" \
              "${budget_mode[@]}" --session-deadline-utc "$MST2_SESSION_DEADLINE" --rounds "$ROUNDS"
          fi

      - name: Stage safe benchmark evidence
        id: safe_evidence
        if: always()
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import os, sys
          sys.path.insert(0, 'scorpiofs/tests/mst2-e2e')
          from commit_update_budget import require_external_time
          require_external_time(os.environ['DEADLINE_INPUT'])
          PY
          safe="$RUNNER_TEMP/mst2-safe-evidence"
          if test "$COMPARISON" = isolated; then
            python3 -B scorpiofs/tests/mst2-e2e/workspace_update_campaign_export.py \
              --run-root "$MST2_OWNED_ROOT" --output "$safe" --session-deadline-utc "$DEADLINE_INPUT" \
              --build-a "$MST2_BUILD_A" --build-b "$MST2_BUILD_B" --server-build "$MST2_SERVER_BUILD" --with-run-metadata
            find "$safe" -type f -printf '%P\n' | sort
            exit 0
          fi
          rm -rf -- "$safe"
          install -d -m 700 "$safe"
          python3 -B - "$safe/run.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          record = {
              'run_id': os.environ['GITHUB_RUN_ID'], 'attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'harness_sha': os.environ['SCORPIO_SHA'], 'mega_sha': os.environ['MEGA_SHA'],
              'profile': os.environ['PROFILE'], 'rounds': int(os.environ['ROUNDS']),
              'comparison': os.environ['COMPARISON'],
              'session_started_utc': os.environ['STARTED_INPUT'],
              'session_deadline_utc': os.environ['DEADLINE_INPUT'],
          }
          if os.environ.get('READ_PROFILE_INPUT', 'false') == 'true':
              record['measurement_interpretation'] = 'INSTRUMENTED_DIAGNOSTIC_NOT_FREE_PERFORMANCE_BASELINE'
              record['performance_comparison_allowed'] = False
          Path(sys.argv[1]).write_text(json.dumps(record, sort_keys=True) + '\n', encoding='utf-8')
          PY
          if test "$COMPARISON" = paired; then
            for label in A B; do
              variable="MST2_BUILD_$label"
              receipt="${!variable:-}"
              if test -n "$receipt" && test -f "$receipt" && test ! -L "$receipt"; then
                cp --no-preserve=mode,ownership --no-target-directory -- "$receipt" "$safe/client-$label-build.json"
                chmod 600 "$safe/client-$label-build.json"
              fi
            done
          fi
          owned_root="${MST2_OWNED_ROOT:-}"
          root="$owned_root/measurements"
          if test -f "$owned_root/failure.json" && test ! -L "$owned_root/failure.json"; then
            cp --no-preserve=mode,ownership --no-target-directory -- "$owned_root/failure.json" "$safe/failure.json"
            chmod 600 "$safe/failure.json"
          fi
          if test -d "$root"; then
            while IFS= read -r -d '' source; do
              relative="${source#"$root"/}"
              target="$safe/measurements/$relative"
              case "$relative" in
                */service.toml|*/dependencies.json|*/token*|*/service-private.log|*/scorpio-private.log) continue ;;
              esac
              case "$relative" in
                measurements.jsonl|workspace-observation.jsonl|failure.json|*/measurements.jsonl|*/workspace-observation.jsonl|*/failure.json|*/owned-workspace-daemon.json|*/owned-workspace-worker.json)
                  install -d -m 700 "$(dirname "$target")"
                  test -f "$source" && test ! -L "$source"
                  cp --no-preserve=mode,ownership --no-target-directory -- "$source" "$target"
                  chmod 600 "$target"
                  ;;
              esac
            done < <(find "$root" -type f -print0)
          fi
          python3 -B - "$safe/measurements" <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, 'scorpiofs/tests/mst2-e2e')
          from workspace_update_profile import validate_artifact_tree
          path = Path(sys.argv[1])
          if path.exists():
              validate_artifact_tree(path, diagnostic_required=os.environ.get('READ_PROFILE_INPUT', 'false') == 'true')
          PY
          find "$safe" -type f -printf '%P\n' | sort
          python3 -B - <<'PY'
          import os, sys
          sys.path.insert(0, 'scorpiofs/tests/mst2-e2e')
          from commit_update_budget import require_external_time
          require_external_time(os.environ['DEADLINE_INPUT'])
          PY

      - name: Admit upload within the original absolute deadline
        if: always()
        id: upload_admission
        timeout-minutes: 1
        shell: bash
        run: |
          python3 -B - <<'PY'
          import os, sys
          sys.path.insert(0, 'scorpiofs/tests/mst2-e2e')
          from commit_update_budget import require_external_time
          # Nine minutes for the action, one minute for its final UTC check.
          require_external_time(os.environ['DEADLINE_INPUT'], 10 * 60)
          PY

      - name: Upload safe benchmark evidence
        if: always() && steps.safe_evidence.outcome == 'success' && steps.upload_admission.outcome == 'success'
        id: evidence_upload
        timeout-minutes: 9
        uses: actions/upload-artifact@v6
        with:
          name: mst2-v3-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mst2-safe-evidence
          if-no-files-found: error
          retention-days: 7

      - name: Verify successful upload ended before the original deadline
        if: always() && steps.evidence_upload.outcome == 'success'
        timeout-minutes: 1
        shell: bash
        run: |
          python3 -B - <<'PY'
          import os, sys
          sys.path.insert(0, 'scorpiofs/tests/mst2-e2e')
          from commit_update_budget import require_external_time
          require_external_time(os.environ['DEADLINE_INPUT'])
          print('Evidence upload finished within the original session deadline')
          PY
