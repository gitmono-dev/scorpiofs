name: Benchmark correctness gates

on:
  pull_request:
    paths:
      - src/snapshot/**
      - src/workspace/**
      - tests/mst2-e2e/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/bench.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-gates-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Benchmark correctness gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run shipped v3 evidence and oracle gates
        run: |
          python -B -m unittest discover -s tests/mst2-e2e -p 'test_commit_update_*.py' -v
          python -B -m unittest discover -s tests/mst2-e2e -p 'test_workspace_update_*.py' -v
          python -B -m py_compile tests/mst2-e2e/*.py
