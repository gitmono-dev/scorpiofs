name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  workspace-evidence:
    name: Workspace v3 evidence checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check actual POSIX evidence and streamed content oracle
        run: python3 -B -m unittest discover -s tests/mst2-e2e -p 'test_workspace_update_*.py' -v

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo +nightly fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Build
        run: cargo build --verbose
      
      - name: Build release
        run: cargo build --release --verbose

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run tests
        run: cargo test --verbose

      - name: Check real runner budgets and process cleanup
        run: |
          python3 -B tests/mst2-e2e/test_commit_update_bench.py -v
          python3 -B tests/mst2-e2e/test_commit_update_budget.py -v
          python3 -B tests/mst2-e2e/test_commit_update_projection.py -v
          python3 -B -m unittest discover -s tests/mst2-e2e -p 'test_workspace_update_*.py' -v


  docker:
    name: Docker image
    runs-on: ubuntu-latest
    # Full release build inside the container (no host cargo cache reuse).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build only — nothing is pushed. This guards the Dockerfile and
      # .dockerignore that the mega2 IT compose stack builds from
      # (`build: context: ../scorpiofs`, image `scorpiofs:local`).
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: scorpiofs:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke the image
        run: |
          set -euo pipefail
          # The workspace binary runs through the entrypoint.
          docker run --rm scorpiofs:ci --version
          docker run --rm scorpiofs:ci workspace --help
          docker run --rm --entrypoint sh scorpiofs:ci -c 'test ! -e /usr/local/bin/antares'

          # The entrypoint must refuse `serve` without the actual MST/2 URL.
          if docker run --rm scorpiofs:ci serve; then
            echo "entrypoint accepted serve without SCORPIO_MST2_BASE_URL" >&2
            exit 1
          fi

          # The shipped CLI endpoint flag is also an explicit live endpoint.
          docker run --rm scorpiofs:ci --mst2-base-url http://mega.example:8000 config validate

          # The baked config plus the image ENV overrides must validate.
          docker run --rm \
            -e SCORPIO_MST2_BASE_URL=http://mega.example:8000 \
            scorpiofs:ci config validate

          # FUSE prerequisites inside the container (the same device/cap/apparmor
          # trio the compose stacks grant). `doctor` fails on missing /dev/fuse or
          # non-writable runtime dirs; an unreachable mega server is only a warning.
          docker run --rm \
            --device /dev/fuse --cap-add SYS_ADMIN --security-opt apparmor:unconfined \
            -e SCORPIO_MST2_BASE_URL=http://mega.example:8000 \
            scorpiofs:ci doctor

      - name: Smoke the rendered compose workspace daemon
        run: |
          set -euo pipefail
          docker compose --env-file /dev/null -f docker-compose.yml config --format json > "$RUNNER_TEMP/scorpiofs-compose.json"
          python3 - "$RUNNER_TEMP/scorpiofs-compose.json" <<'PY'
          import json
          import subprocess
          import sys
          import time

          with open(sys.argv[1], encoding="utf-8") as source:
              service = json.load(source)["services"]["scorpiofs"]
          environment = service["environment"]
          assert environment.get("SCORPIO_MST2_BASE_URL"), "compose must supply the live MST/2 endpoint"
          for retired in ("SCORPIO_BASE_URL", "SCORPIO_LFS_URL", "SCORPIO_WORKSPACE", "SCORPIO_ANTARES_MOUNT_ROOT"):
              assert retired not in environment, "compose still selects a retired runtime setting"
          arguments = ["docker", "run", "--detach", "--rm"]
          for key, value in environment.items():
              if key.startswith("SCORPIO_"):
                  arguments.extend(["--env", f"{key}={value}"])
          container = subprocess.check_output(arguments + ["scorpiofs:ci"], text=True).strip()
          try:
              for _ in range(30):
                  health = subprocess.run(["docker", "exec", container, "curl", "-fsS",
                                           "--max-time", "2", "http://127.0.0.1:2725/health"], capture_output=True, text=True)
                  if health.returncode == 0:
                      assert json.loads(health.stdout)["status"] == "ok"
                      break
                  time.sleep(1)
              else:
                  raise AssertionError("the actual compose environment did not start the v3 daemon")
              listed = subprocess.check_output(["docker", "exec", container, "curl", "-fsS",
                                                "--max-time", "2", "http://127.0.0.1:2725/v3/workspaces"], text=True)
              assert json.loads(listed) == [], "startup must not create or mount a workspace"
              retired = subprocess.check_output(["docker", "exec", container, "curl", "-sS", "-o", "/dev/null",
                                                 "--max-time", "2", "-w", "%{http_code}", "http://127.0.0.1:2725/api/fs/mpoint"], text=True)
              assert retired == "404", "the compose daemon must expose only the v3 control contract"
          finally:
              subprocess.run(["docker", "stop", "--time", "45", container], check=True)
          PY
